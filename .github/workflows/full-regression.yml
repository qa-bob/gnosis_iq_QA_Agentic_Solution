name: Full Regression Suite

# Manual only: the QA workflow (qa.yml) now runs smoke tests on push/PR and the scheduled suites.
on:
  workflow_dispatch:

jobs:
  regression:
    name: Full Regression — ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, mobile-chrome, tablet]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full test suite
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
          SITE_URL: ${{ github.event.inputs.site_url }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
